plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mk.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.mk.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // debug key so assembleRelease is installable; swap for a real one
            // before deploying, and regenerate the provisioning QR afterwards
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { checkReleaseBuilds false }
}

dependencies {
    implementation files('libs/kiosk.aar')
}
